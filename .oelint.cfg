# oelint-adv configuration for meta-llama-cpp
# Docs: https://github.com/priv-kweihmann/oelint-adv
#
# Auto-loaded when oelint-adv runs from the repo root
# (scripts/lint.sh and .github/workflows/lint.yml both do).
#
# Keys mirror the command-line options (dashes become underscores).
# List values are one entry per line, indented for continuation.

[oelint]
# Oldest Yocto release in LAYERSERIES_COMPAT; keeps findings relevant to
# every release this layer claims to support.
release = kirkstone

# Rules deliberately silenced for this layer, one per line:
#   filesoverride          - a per-package FILES:${PN}-<pkg> must be a plain
#                            assignment; there is nothing to append to.
#   suggestedvar.AUTHOR    - optional metadata omitted for this small layer.
#   suggestedvar.BUGTRACKER  (same)
#   suggestedvar.SECTION     (same)
#   bbclassextend          - target-only recipe; no native/nativesdk variants.
#   multilineident         - continuation lines are indented 4 spaces, not
#                            aligned under the opening quote.
suppress =
    oelint.var.filesoverride
    oelint.var.suggestedvar.AUTHOR
    oelint.var.suggestedvar.BUGTRACKER
    oelint.var.suggestedvar.SECTION
    oelint.var.bbclassextend
    oelint.vars.multilineident

# To silence a single line instead, add an inline comment in the recipe:
#   FOO = "bar"   # nooelint: oelint.vars.somerule
